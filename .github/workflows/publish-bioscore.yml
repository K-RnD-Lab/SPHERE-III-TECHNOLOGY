name: Publish bioscore

on:
  push:
    tags:
      - "bioscore-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: pip install build
      - name: Build package
        run: python -m build
        working-directory: "T1 - Research Tools, ML & Analytical Engines/T1-R2 - Biomedical Scoring Toolkit/R2a-bioscore"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: "T1 - Research Tools, ML & Analytical Engines/T1-R2 - Biomedical Scoring Toolkit/R2a-bioscore/dist"
