name: Publish set-method

on:
  push:
    tags:
      - "set-method-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: pip install build
      - name: Build package
        run: python -m build
        working-directory: "T2 - Reproducibility, Scoring & Method Systems/T2-R2 - SET Method Toolkit/R2a-set-method"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: "T2 - Reproducibility, Scoring & Method Systems/T2-R2 - SET Method Toolkit/R2a-set-method/dist"
