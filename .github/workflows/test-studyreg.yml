name: Test studyreg

on:
  push:
    paths:
      - "T3 - Dashboards, Interfaces & Open Infrastructure/T3-R2 - Study Registry Client/R2a-studyreg/**"
  pull_request:
    paths:
      - "T3 - Dashboards, Interfaces & Open Infrastructure/T3-R2 - Study Registry Client/R2a-studyreg/**"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          cd "T3 - Dashboards, Interfaces & Open Infrastructure/T3-R2 - Study Registry Client/R2a-studyreg"
          pip install -e .
      - name: Run tests
        run: |
          cd "T3 - Dashboards, Interfaces & Open Infrastructure/T3-R2 - Study Registry Client/R2a-studyreg"
          python -m pytest tests/ -v
