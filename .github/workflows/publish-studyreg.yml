name: Publish studyreg

on:
  push:
    tags:
      - "studyreg-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: pip install build
      - name: Build package
        run: python -m build
        working-directory: "T3 - Dashboards, Interfaces & Open Infrastructure/T3-R2 - Study Registry Client/R2a-studyreg"
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: "T3 - Dashboards, Interfaces & Open Infrastructure/T3-R2 - Study Registry Client/R2a-studyreg/dist"
