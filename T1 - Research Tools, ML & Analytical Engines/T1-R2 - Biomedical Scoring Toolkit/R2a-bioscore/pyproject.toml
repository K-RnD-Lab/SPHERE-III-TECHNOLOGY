[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bioscore"
version = "0.1.0"
description = "Biomedical scoring toolkit — reproducibility, data quality, and model readiness metrics for computational biology"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "K-RnD Lab"}]
keywords = ["bioscore", "bioinformatics", "reproducibility", "scoring", "computational-biology"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.urls]
Homepage = "https://github.com/K-RnD-Lab/SPHERE-III-TECHNOLOGY"
Repository = "https://github.com/K-RnD-Lab/SPHERE-III-TECHNOLOGY"

[tool.hatch.build.targets.wheel]
packages = ["src/bioscore"]

[tool.hatch.build.targets.sdist]
include = ["src/bioscore", "README.md", "pyproject.toml", "tests"]
