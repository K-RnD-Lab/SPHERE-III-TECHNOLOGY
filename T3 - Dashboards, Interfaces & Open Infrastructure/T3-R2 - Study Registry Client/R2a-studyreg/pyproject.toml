[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "studyreg"
version = "0.1.0"
description = "Study Registry client — register, search, and manage reproducible computational studies"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "K-RnD-Lab"}]
keywords = ["studyreg", "registry", "reproducibility", "computational-science", "open-science"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/K-RnD-Lab/SPHERE-III-TECHNOLOGY"
Repository = "https://github.com/K-RnD-Lab/SPHERE-III-TECHNOLOGY"

[tool.hatch.build.targets.wheel]
packages = ["src/studyreg"]
