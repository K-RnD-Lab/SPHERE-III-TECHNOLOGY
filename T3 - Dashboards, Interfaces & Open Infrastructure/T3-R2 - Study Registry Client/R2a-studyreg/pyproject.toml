[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "studyreg"
version = "0.1.0"
description = "Programmatic study registry: pre-register computational studies with one function call, search by domain/sphere/tags, validate before submission"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "K-RnD Lab"}]
keywords = ["studyreg", "registry", "reproducibility", "computational-science", "open-science", "pre-registration", "validation", "search", "SET"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Database",
]

[project.urls]
Homepage = "https://github.com/K-RnD-Lab/SPHERE-III-TECHNOLOGY"
Repository = "https://github.com/K-RnD-Lab/SPHERE-III-TECHNOLOGY"

[tool.hatch.build.targets.wheel]
packages = ["src/studyreg"]

[tool.hatch.build.targets.sdist]
include = ["src/studyreg", "README.md", "pyproject.toml", "tests"]
