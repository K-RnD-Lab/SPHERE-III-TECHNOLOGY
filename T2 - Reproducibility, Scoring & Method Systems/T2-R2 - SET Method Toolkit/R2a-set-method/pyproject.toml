[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "set-method"
version = "0.1.0"
description = "SET methodology toolkit — classify, score, and recommend across Science, Entrepreneurship, and Technology spheres"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{name = "K-RnD-Lab"}]
keywords = ["set-method", "science", "entrepreneurship", "technology", "scoring", "venture"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/K-RnD-Lab/SPHERE-III-TECHNOLOGY"
Repository = "https://github.com/K-RnD-Lab/SPHERE-III-TECHNOLOGY"

[tool.hatch.build.targets.wheel]
packages = ["src/set_method"]

[tool.hatch.build.targets.sdist]
include = ["src/set_method", "README.md", "pyproject.toml", "tests"]
